name: scamshield

x-backend: &backend
  build:
    context: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scamshield}:${POSTGRES_PASSWORD:-scamshield}@db:5432/${POSTGRES_DB:-scamshield}
    REDIS_URL: redis://redis:6379/0
    TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scamshield}:${POSTGRES_PASSWORD:-scamshield}@db:5432/scamshield_test
    TEST_REDIS_URL: redis://redis:6379/15
    # Windows/macOS bind mounts do not propagate file events reliably.
    WATCHFILES_FORCE_POLLING: "true"
    FORWARDED_ALLOW_IPS: ${TRUSTED_PROXIES:-127.0.0.1}
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker.main"]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scamshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scamshield}
      POSTGRES_DB: ${POSTGRES_DB:-scamshield}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
