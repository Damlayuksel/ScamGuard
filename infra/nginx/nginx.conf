# Main Nginx configuration for production.
# Privacy (CLAUDE.md, security 2 and 12): no client IPs, user agents or request bodies in
# logs, phone numbers in /numbers/... paths are masked. error_log stays at "crit" because
# lower levels include the client address.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log crit;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # /api/v1/numbers/+905321234567/dispute -> /api/v1/numbers/***/dispute
    map $request_uri $log_uri {
        "~^(?<log_pre>.*/numbers/)(?!report(?:[/?#]|$))[^/?#]+(?<log_post>.*)$" "${log_pre}***${log_post}";
        default $request_uri;
    }

    log_format privacy '[$time_iso8601] "$request_method $log_uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log privacy;

    # Extra flood protection in front of the API's own Redis limits. The address is used
    # only in shared memory and is never logged.
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_status 429;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

    include /etc/nginx/conf.d/*.conf;
}
