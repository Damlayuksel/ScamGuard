name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scamshield
          POSTGRES_PASSWORD: scamshield
          POSTGRES_DB: scamshield_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scamshield -d scamshield_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
      DATABASE_URL: postgresql+asyncpg://scamshield:scamshield@localhost:5432/scamshield_test
      TEST_DATABASE_URL: postgresql+asyncpg://scamshield:scamshield@localhost:5432/scamshield_test
      REDIS_URL: redis://localhost:6379/15
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Jest
        run: npm test -- --ci

      - name: Web build
        run: npm run build:web

  infra:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Compose file
        run: |
          cp infra/.env.prod.example infra/.env.prod
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod config --quiet

      - name: Web image (includes the CSP check)
        run: docker build -f infra/nginx/Dockerfile -t scamshield-web:ci .

      - name: Nginx configuration
        run: >
          docker run --rm -e DOMAIN=example.com -e HSTS_MAX_AGE=300
          --add-host api:127.0.0.1 scamshield-web:ci nginx -t
